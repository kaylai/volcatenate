[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "volcatenate"
version = "0.5.1"
description = "Unified volcanic degassing model comparison toolkit"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.3",
    "pandas>=2.2.3",
    "scipy>=1.15.3",
    "pyyaml",
    "openpyxl>=3.1.5",
    "rich>=13.0",
    "VolFe>=1.0.1",
    "VESIcal>=1.2.12",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
plotting = ["matplotlib", "plotly"]

[tool.pytest.ini_options]
markers = [
    "integration: requires external library (EVo, VolFe, VESIcal, SulfurX, or MAGEC)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volcatenate = ["default_config.yaml", "data/magec_shims/*.m", "data/magec_solver/*.m"]
